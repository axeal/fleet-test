defaultNamespace: cattle-elemental-system

dependsOn:
  - selector:
      matchLabels:
        elemental: crds

helm:
  repo: oci://registry.suse.com/rancher/elemental-operator-chart
  releaseName: elemental-operator
  atomic: true
  waitForJobs: true
  timeoutSeconds: 300
  takeOwnership: true

rolloutStrategy:
  maxUnavailable: 15%
  maxNew: 50
