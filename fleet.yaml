defaultNamespace: guestbook

helm:
  takeOwnership: true
  releaseName: guestbook
  chart: https://github.com/rancher/fleet-examples/releases/download/example/guestbook-0.0.1.tgz
  valuesFiles:
  - values.yaml

targetCustomizations:
- name: do
  helm:
    values:
      replicas: 3
  clusterSelector:
    matchLabels:
      env: do
  namespaceAnnotations:
    field.cattle.io/projectId: c-m-lsz29q2t:do-infra

- name: custom
  helm:
    values:
      replicas: 2
  clusterSelector:
    matchLabels:
      env: custom
  namespaceAnnotations:
    field.cattle.io/projectId: c-m-zn58xqh8:custom-infra
