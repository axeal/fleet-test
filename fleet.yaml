namespace: default
targetCustomizations:
- name: dev
  namespace: dev
  clusterSelector:
    matchLabels:
      env: dev
  kustomize:
    dir: overlays/dev

- name: prod
  namespace: prod
  clusterSelector:
    matchLabels:
      env: dev
  kustomize:
    dir: overlays/prod

- name: test
  clusterSelector:
    matchLabels:
      env: test
  kustomize:
    dir: overlays/test

