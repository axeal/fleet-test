defaultNamespace: guestbook

helm:
  takeOwnership: true
  releaseName: guestbook
  chart: https://github.com/rancher/fleet-examples/releases/download/example/guestbook-0.0.1.tgz
  valuesFiles:
  - values.yaml

targetCustomizations:
- name: do
  helm:
    values:
      replicas: 3
  clusterSelector:
    matchLabels:
      env: do
  kustomize:
    dir: overlays/do

- name: custom
  helm:
    values:
      replicas: 2
  clusterSelector:
    matchLabels:
      env: custom
  kustomize:
    dir: overlays/custom
