helm:
  takeOwnership: true
  releaseName: guestbook
  chart: https://github.com/rancher/fleet-examples/releases/download/example/guestbook-0.0.1.tgz
  valuesFiles:
  - values.yaml

targetCustomizations:
- name: do
  clusterSelector:
    matchLabels:
      env: do
  defaultNamespace: guestbook
  namespaceAnnotations:
    field.cattle.io/projectId: c-m-2mzdt4fm:do-infra

- name: custom
  clusterSelector:
    matchLabels:
      env: custom
  defaultNamespace: guestbook
  namespaceAnnotations:
    field.cattle.io/projectId: c-m-n8vv9p2x:custom-infra
