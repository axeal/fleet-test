defaultNamespace: guestbook

dependsOn:
  - selector:
      matchLabels:
        bundle: guestbook-namespace

helm:
  takeOwnership: true
  releaseName: guestbook
  chart: https://github.com/rancher/fleet-examples/releases/download/example/guestbook-0.0.1.tgz
  valuesFiles:
  - values.yaml

targetCustomizations:
- name: do
  helm:
    values:
      replicas: 3
  clusterSelector:
    matchLabels:
      env: do

- name: custom
  helm:
    values:
      replicas: 2
  clusterSelector:
    matchLabels:
      env: custom
