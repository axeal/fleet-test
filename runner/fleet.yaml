defaultNamespace: arc-runners

labels:
  app: arc-runner

dependsOn:
  - selector:
      matchLabels:
        app: arc-operator

helm:
  releaseName: arc-runner-set
  chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  values:
    githubConfigSecret: preexisting-secret
    runnerScaleSetName: "arc-runner-set"
    minRunners: 1
    maxRunners: 5

    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2375
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work

          - name: dind
            image: docker:dind
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
            args:
              - dockerd
              - --host=tcp://localhost:2375
            volumeMounts:
              - name: dind-storage
                mountPath: /var/lib/docker
              - name: work
                mountPath: /home/runner/_work

        volumes:
          - name: dind-storage
            emptyDir: {}
          - name: work
            emptyDir: {}
